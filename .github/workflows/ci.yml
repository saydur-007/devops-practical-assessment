name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find k8s database backup monitoring -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 | xargs -0 kubeconform -summary -ignore-missing-schemas

      - name: Build Service A
        run: |
          docker build \
            -f docker/service-a/Dockerfile \
            -t devops-service-a:${GITHUB_SHA} \
            docker/service-a

      - name: Build Service B
        run: |
          docker build \
            -f docker/service-b/Dockerfile \
            -t devops-service-b:${GITHUB_SHA} \
            docker/service-b

      - name: Trivy scan Service A
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-service-a:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy scan Service B
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-service-b:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
