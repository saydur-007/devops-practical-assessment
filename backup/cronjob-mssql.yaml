apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mssql
  namespace: default
  labels:
    app: backup-mssql
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: backup-mssql
        spec:
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: mssql
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: mssql-data
              persistentVolumeClaim:
                claimName: mssql-data-mssql-0
          initContainers:
            - name: mssql-backup
              image: mcr.microsoft.com/mssql/server:2022-latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MSSQL_SA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-credentials
                      key: MSSQL_SA_PASSWORD
              command:
                - bash
                - -lc
                - |
                  set -euo pipefail
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  backup_file="/var/opt/mssql/backup/mssql-appdb-${ts}.bak"
                  /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "BACKUP DATABASE [appdb] TO DISK = N'${backup_file}' WITH INIT, COMPRESSION, CHECKSUM;"
            - name: compress
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  gzip /var/opt/mssql/backup/mssql-appdb-*.bak
              volumeMounts:
                - name: mssql-data
                  mountPath: /var/opt/mssql
          containers:
            - name: upload
              image: minio/mc:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: minio-credentials
              command:
                - sh
                - -c
                - |
                  set -eu
                  mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  mc cp /var/opt/mssql/backup/mssql-appdb-*.bak.gz local/db-backups/mssql/
                  rm -f /var/opt/mssql/backup/mssql-appdb-*.bak.gz
              volumeMounts:
                - name: mssql-data
                  mountPath: /var/opt/mssql
